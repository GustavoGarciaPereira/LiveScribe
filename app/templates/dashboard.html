<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoDaLive — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
        h1 { margin-bottom: 1rem; }
        select, input, button { padding: 0.5rem 1rem; font-size: 1rem; border-radius: 6px; margin-bottom: 0.5rem; }
        input { background: #334155; border: 1px solid #475569; color: #e2e8f0; }
        button { background: #3b82f6; border: none; color: #fff; cursor: pointer; font-weight: 600; }
        button:hover { background: #2563eb; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.1rem; color: #94a3b8; }
        canvas { max-height: 300px; }
        .hidden { display: none; }
        .error { color: #f87171; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>📊 PulsoDaLive — Dashboard</h1>

    <!-- Seção de Autenticação -->
    <div id="auth-section" class="card">
        <h2>Login</h2>
        <div id="login-form">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Senha" required>
            <button id="login-btn">Entrar</button>
            <div id="login-error" class="error"></div>
        </div>
        <div id="user-info" class="hidden">
            <p>✅ Logado como <strong id="display-email"></strong></p>
            <button id="logout-btn" class="danger">Sair</button>
        </div>
    </div>

    <!-- Seção de Dados (inicialmente oculta) -->
    <div id="data-section" class="hidden">
    <label for="live-select">Selecione uma live:</label>
    <select id="live-select">
        <option value="">-- Carregando lives... --</option>
    </select>

    <div class="grid">
        <div class="card">
            <h2>📈 Sentimentos ao longo do tempo</h2>
            <canvas id="timeline-chart"></canvas>
        </div>
        <div class="card">
            <h2>🔥 Picos de engajamento</h2>
            <canvas id="peaks-chart"></canvas>
        </div>
        <div class="card">
            <h2>🔤 Frequência de palavras</h2>
            <canvas id="words-chart"></canvas>
        </div>
        <div class="card">
            <h2>🧠 Tópicos (TF-IDF)</h2>
            <canvas id="topics-chart"></canvas>
        </div>
    </div>

<script>
const API = '/api/chat';

let timelineChart, peaksChart, wordsChart, topicsChart;

async function loadLives() {
    const res = await fetch(`${API}/lives`, { headers: getHeaders() });
    const data = await res.json();
    const select = document.getElementById('live-select');
    select.innerHTML = '<option value="">-- Selecione uma live --</option>';
    data.lives.forEach(l => {
        select.innerHTML += `<option value="${l.live_id}">${l.live_id} (${l.total_messages} msgs)</option>`;
    });
}

document.getElementById('live-select').addEventListener('change', async (e) => {
    const liveId = e.target.value;
    if (!liveId) return;
    await Promise.all([
        loadTimeline(liveId),
        loadPeaks(liveId),
        loadWords(liveId),
        loadTopics(liveId),
    ]);
});

async function loadTimeline(liveId) {
    const res = await fetch(`${API}/${liveId}/sentiment-timeline?interval_minutes=5`, { headers: getHeaders() });
    const data = await res.json();
    const labels = data.timeline.map(b => b.start_time.slice(11,16));
    const pos = data.timeline.map(b => b.sentiments.Positivo);
    const neg = data.timeline.map(b => b.sentiments.Negativo);
    const neu = data.timeline.map(b => b.sentiments.Neutro);
    if (timelineChart) timelineChart.destroy();
    timelineChart = new Chart(document.getElementById('timeline-chart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'Positivo', data: pos, borderColor: '#22c55e', fill: false },
                { label: 'Negativo', data: neg, borderColor: '#ef4444', fill: false },
                { label: 'Neutro',   data: neu, borderColor: '#94a3b8', fill: false },
            ]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });
}

async function loadPeaks(liveId) {
    const res = await fetch(`${API}/${liveId}/engagement-peaks?top_n=10&window_minutes=1`, { headers: getHeaders() });
    const data = await res.json();
    const labels = data.peaks.map(p => p.time.slice(11,16));
    const counts = data.peaks.map(p => p.message_count);
    if (peaksChart) peaksChart.destroy();
    peaksChart = new Chart(document.getElementById('peaks-chart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [{ label: 'Mensagens', data: counts, backgroundColor: '#f97316' }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });
}

async function loadWords(liveId) {
    const res = await fetch(`${API}/${liveId}/word-frequency?top_n=10`, { headers: getHeaders() });
    const data = await res.json();
    const labels = data.word_frequency.map(w => w.palavra);
    const counts = data.word_frequency.map(w => w.frequencia);
    if (wordsChart) wordsChart.destroy();
    wordsChart = new Chart(document.getElementById('words-chart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [{ label: 'Frequência', data: counts, backgroundColor: '#3b82f6' }]
        },
        options: { responsive: true, indexAxis: 'y' }
    });
}

async function loadTopics(liveId) {
    const res = await fetch(`${API}/${liveId}/topics?top_n=10`, { headers: getHeaders() });
    const data = await res.json();
    const labels = data.topics.map(t => t.term);
    const scores = data.topics.map(t => t.score);
    if (topicsChart) topicsChart.destroy();
    topicsChart = new Chart(document.getElementById('topics-chart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [{ label: 'Score TF-IDF', data: scores, backgroundColor: '#8b5cf6' }]
        },
        options: { responsive: true, indexAxis: 'y' }
    });
}

loadLives();
</script>
    </div><!-- #data-section -->

<script>
// --- Gestão da Autenticação ---
const API_BASE = '';
const authSection = document.getElementById('auth-section');
const dataSection = document.getElementById('data-section');
const loginForm = document.getElementById('login-form');
const userInfo = document.getElementById('user-info');
const displayEmail = document.getElementById('display-email');

function getHeaders() {
    const token = localStorage.getItem('token');
    return token ? { 'Authorization': `Bearer ${token}` } : {};
}

function checkAuthState() {
    const token = localStorage.getItem('token');
    const email = localStorage.getItem('user_email');
    if (token && email) {
        loginForm.classList.add('hidden');
        userInfo.classList.remove('hidden');
        displayEmail.textContent = email;
        dataSection.classList.remove('hidden');
        loadLives();
    } else {
        loginForm.classList.remove('hidden');
        userInfo.classList.add('hidden');
        dataSection.classList.add('hidden');
    }
}

document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');
    errorDiv.textContent = '';
    try {
        const resp = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (!resp.ok) { const d = await resp.json(); throw new Error(d.detail || 'Falha no login'); }
        const data = await resp.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user_email', data.user.email);
        checkAuthState();
    } catch (e) { errorDiv.textContent = e.message; }
});

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('user_email');
    checkAuthState();
});

checkAuthState();
</script>
</body>
</html>
