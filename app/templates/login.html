<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — PulsoDaLive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            width: 100%; max-width: 420px; padding: 1rem;
        }
        .login-card {
            background: #1e293b; border-radius: 16px; padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center; margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.5rem; color: #f1f5f9;
        }
        .logo h1 span { color: #3b82f6; }
        .logo p { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }

        .form-group { margin-bottom: 1rem; }
        label {
            display: block; font-size: 0.875rem; font-weight: 500;
            color: #94a3b8; margin-bottom: 0.375rem;
        }
        input {
            width: 100%; padding: 0.75rem 1rem; font-size: 0.95rem;
            background: #0f172a; border: 1px solid #334155; border-radius: 8px;
            color: #e2e8f0; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; }
        input::placeholder { color: #475569; }

        .btn {
            width: 100%; padding: 0.75rem 1rem; border: none; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center;
            justify-content: center; gap: 0.5rem;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-google {
            background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
        }
        .btn-google:hover { background: #334155; border-color: #475569; }

        .divider {
            display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0;
            color: #475569; font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #334155;
        }

        .footer-text {
            text-align: center; margin-top: 1.25rem; font-size: 0.875rem;
            color: #64748b;
        }
        .footer-text a {
            color: #60a5fa; text-decoration: none; font-weight: 500;
        }
        .footer-text a:hover { text-decoration: underline; }

        #status {
            margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
            display: none; font-size: 0.875rem; text-align: center;
        }
        #status.error { display: block; background: #450a0a; color: #fca5a5; }
        #status.success { display: block; background: #14532d; color: #86efac; }
        #status.loading { display: block; background: #1e3a5f; color: #93c5fd; }

        .register-fields { display: none; }
        .register-fields.visible { display: block; }
        .toggle-mode {
            background: none; border: none; color: #60a5fa; cursor: pointer;
            font-size: 0.875rem; font-weight: 500; padding: 0;
        }
        .toggle-mode:hover { text-decoration: underline; }

        .name-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem 1.25rem; }
            .name-row { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="/static/css/nav.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1>🔴 <span>PulsoDaLive</span></h1>
            <p>Análise de chat ao vivo</p>
        </div>

        <!-- Abas: Entrar / Cadastrar -->
        <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;background:#0f172a;border-radius:8px;padding:0.25rem;">
            <button id="tab-login" class="tab-active" style="flex:1;padding:0.5rem;border:none;border-radius:6px;background:#3b82f6;color:white;font-weight:600;cursor:pointer;font-size:0.875rem;transition:all 0.2s;">Entrar</button>
            <button id="tab-register" style="flex:1;padding:0.5rem;border:none;border-radius:6px;background:transparent;color:#94a3b8;font-weight:500;cursor:pointer;font-size:0.875rem;transition:all 0.2s;">Cadastrar</button>
        </div>

        <!-- Formulário de Login -->
        <div id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="login-btn">Entrar</button>
        </div>

        <!-- Formulário de Cadastro (oculto) -->
        <div id="register-form" style="display:none;">
            <div class="form-group">
                <label for="reg-name">Nome</label>
                <input type="text" id="reg-name" placeholder="Seu nome" autocomplete="name" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="reg-password">Senha</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" id="register-btn">Criar conta</button>
        </div>

        <div class="divider">ou</div>

        <!-- Google OAuth -->
        <button class="btn btn-google" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Entrar com Google
        </button>

        <div id="status"></div>

        <div class="footer-text">
            <span id="footer-msg">Ao continuar, você concorda com nossos <a href="#">Termos de Uso</a>.</span>
        </div>
    </div>
</div>

<script>
// ── Parâmetros ────────────────────────────────────────────────
const urlParams = new URLSearchParams(window.location.search);
const nextUrl = urlParams.get('next') || '/dashboard';

// ── Abas ──────────────────────────────────────────────────────
const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');

function setActiveTab(tab) {
    const isLogin = tab === 'login';
    [tabLogin, tabRegister].forEach(t => {
        t.style.background = 'transparent';
        t.style.color = '#94a3b8';
    });
    const active = isLogin ? tabLogin : tabRegister;
    active.style.background = '#3b82f6';
    active.style.color = 'white';
    loginForm.style.display = isLogin ? 'block' : 'none';
    registerForm.style.display = isLogin ? 'none' : 'block';
}

tabLogin.addEventListener('click', () => setActiveTab('login'));
tabRegister.addEventListener('click', () => setActiveTab('register'));

// ── Login ─────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
        showStatus('Preencha email e senha.', 'error');
        return;
    }
    setLoading(true);
    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
        });
        if (!resp.ok) {
            const data = await resp.json();
            showStatus(data.detail || 'Erro ao entrar', 'error');
            return;
        }
        // Cookie HttpOnly já foi setado pelo servidor
        window.location.href = nextUrl;
    } catch (err) {
        showStatus('Erro de conexão: ' + err.message, 'error');
    } finally {
        setLoading(false);
    }
});

// ── Cadastro ──────────────────────────────────────────────────
document.getElementById('register-btn').addEventListener('click', async () => {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !email || !password) {
        showStatus('Preencha todos os campos.', 'error');
        return;
    }
    if (password.length < 6) {
        showStatus('Senha deve ter no mínimo 6 caracteres.', 'error');
        return;
    }
    setLoading(true);
    try {
        const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
        });
        if (!resp.ok) {
            const data = await resp.json();
            showStatus(data.detail || 'Erro ao cadastrar', 'error');
            return;
        }
        window.location.href = nextUrl;
    } catch (err) {
        showStatus('Erro de conexão: ' + err.message, 'error');
    } finally {
        setLoading(false);
    }
});

// ── Google OAuth ──────────────────────────────────────────────
document.getElementById('google-btn').addEventListener('click', async () => {
    try {
        const resp = await fetch('/api/auth/login/google');
        const data = await resp.json();
        if (data.url) {
            // Adiciona state com a URL de redirect
            const redirectUrl = new URL(data.url);
            redirectUrl.searchParams.set('state', nextUrl);
            window.location.href = redirectUrl.toString();
        } else {
            showStatus('Erro ao iniciar login Google.', 'error');
        }
    } catch (err) {
        showStatus('Erro de conexão: ' + err.message, 'error');
    }
});

// ── Utilitários ───────────────────────────────────────────────
function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
}

function setLoading(loading) {
    document.getElementById('login-btn').disabled = loading;
    document.getElementById('register-btn').disabled = loading;
    document.getElementById('google-btn').disabled = loading;
    if (loading) {
        showStatus('Aguarde...', 'loading');
    } else {
        document.getElementById('status').className = '';
        document.getElementById('status').textContent = '';
    }
}

// Enter key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (loginForm.style.display !== 'none') {
            document.getElementById('login-btn').click();
        } else {
            document.getElementById('register-btn').click();
        }
    }
});
</script>
<script src="/static/js/nav.js"></script>
</body>
</html>
